name: publish

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm ci

      - name: read release notes
        id: release_notes
        shell: pwsh
        run: |
          $notes = Get-Content "release-notes.md" -Raw

          "body<<EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: build and publish
        id: tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Hero Craft v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false

      - name: add notes to updater json
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $tag = "v$version"

          gh release download $tag `
            --pattern "latest.json" `
            --dir updater-temp

          $jsonPath = "updater-temp/latest.json"
          $json = Get-Content $jsonPath -Raw | ConvertFrom-Json
          $notes = Get-Content "release-notes.md" -Raw

          $json.notes = $notes

          $json |
            ConvertTo-Json -Depth 20 |
            Set-Content $jsonPath -Encoding utf8NoBOM

          gh release upload $tag $jsonPath --clobber